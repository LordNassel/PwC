version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    # --- I removed the 'ports:' section here! ---
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_network
    restart: unless-stopped

  agentic_streamlit:
    build: .
    container_name: agentic_streamlit
    ports:
      - "8501:8501" # Keep this one so you can see the web UI
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
    depends_on:
      - ollama
    networks:
      - rag_network
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  rag_network:
    driver: bridge